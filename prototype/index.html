<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crystal · Assets & Procurement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F2EE;--surface:#FFFFFF;--surface-2:#F8F7F3;--line:#DAD8D0;--line-2:#EFEDE7;
  --ink:#18202B;--ink-2:#454B55;--muted:#5B6270;--input:#CFCCC2;
  --accent:#0B5F63;--accent-ink:#FFFFFF;--accent-text:#0B5F63;--accent-soft:#E6F0EF;
  --ok-bg:#E0F1E7;--ok:#1B5E3B;--warn-bg:#FBEFD5;--warn:#7A4B00;--bad-bg:#FBE3E1;--bad:#9A1C12;
  --info-bg:#E3ECF7;--info:#1D4A80;--neutral-bg:#ECEBE6;--disabled:#8A909B;
  --nav-bg:#18202B;--nav-ink:#D5D9E1;--nav-muted:#A7AFBD;--nav-line:#2C3544;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161D;--surface:#1A2029;--surface-2:#212833;--line:#2E3642;--line-2:#262D38;
    --ink:#E7EAF0;--ink-2:#B7BFCC;--muted:#9AA3B2;--input:#3A4350;
    --accent:#0F7A7D;--accent-ink:#FFFFFF;--accent-text:#62C7C9;--accent-soft:#16302F;
    --ok-bg:#173826;--ok:#7FD3A2;--warn-bg:#3A2C10;--warn:#F0C46A;--bad-bg:#3D1A17;--bad:#F29B91;
    --info-bg:#16283F;--info:#8DB8F0;--neutral-bg:#2A313C;--disabled:#4E5664;
    --nav-bg:#0C1016;--nav-ink:#D5D9E1;--nav-muted:#8C95A5;--nav-line:#222A35;
  }
}
:root[data-theme="dark"]{
  --bg:#12161D;--surface:#1A2029;--surface-2:#212833;--line:#2E3642;--line-2:#262D38;
  --ink:#E7EAF0;--ink-2:#B7BFCC;--muted:#9AA3B2;--input:#3A4350;
  --accent:#0F7A7D;--accent-ink:#FFFFFF;--accent-text:#62C7C9;--accent-soft:#16302F;
  --ok-bg:#173826;--ok:#7FD3A2;--warn-bg:#3A2C10;--warn:#F0C46A;--bad-bg:#3D1A17;--bad:#F29B91;
  --info-bg:#16283F;--info:#8DB8F0;--neutral-bg:#2A313C;--disabled:#4E5664;
  --nav-bg:#0C1016;--nav-ink:#D5D9E1;--nav-muted:#8C95A5;--nav-line:#222A35;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
.app{display:flex;min-height:100vh}
.side{width:240px;flex-shrink:0;background:var(--nav-bg);color:var(--nav-ink);padding:20px 14px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 14px;border-bottom:1px solid var(--nav-line)}
.brand-mark{width:34px;height:34px;border-radius:8px;background:#0B5F63;display:flex;align-items:center;justify-content:center}
.brand b{display:block;font-size:15px}.brand small{color:var(--nav-muted);font-size:12px}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11px;letter-spacing:.06em;color:var(--nav-muted);padding:0 10px 4px}
.nav-link{display:block;text-decoration:none;color:var(--nav-ink);padding:8px 10px;border-radius:7px;font-size:14px}
.nav-link:hover{background:rgba(255,255,255,.06)}
.nav-link[aria-current="page"]{background:#0B5F63;color:#fff;font-weight:600}
.nav-foot{margin-top:auto;padding:12px 10px;border-top:1px solid var(--nav-line);font-size:12px;color:var(--nav-muted)}
.nav-foot b{display:block;color:var(--nav-ink);font-size:13px;font-weight:500}
.theme-btn{margin-top:8px;background:transparent;border:1px solid var(--nav-line);color:var(--nav-ink);border-radius:6px;padding:6px 10px;cursor:pointer;min-height:32px}
.topbar{display:none}
main{flex:1;min-width:0;padding:26px 32px 40px;display:flex;flex-direction:column;gap:16px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.crumb{font-size:13px;color:var(--muted)}
h1{margin:4px 0 0;font-size:26px;font-weight:700;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.docno{font-family:var(--mono);font-size:13px;color:var(--ink-2);font-weight:400}
.row{display:flex;gap:16px}.row-wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pad{padding:16px 18px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.card-h h2,.h2{margin:0;font-size:15px;font-weight:600}
.sub{font-size:12px;color:var(--muted)}
.note{font-size:13px;color:var(--ink-2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:700;font-family:var(--mono)}
.mono{font-family:var(--mono)}.r{text-align:right}.b{font-weight:600}
.btn{min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--input);background:var(--surface);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.08);border-color:var(--accent)}
.btn-danger{color:var(--bad)}.btn-warn{color:var(--warn)}
.btn[disabled],.btn[aria-disabled="true"]{background:var(--disabled);border-color:var(--disabled);color:#fff;cursor:not-allowed;filter:none}
.btn-sm{min-height:32px;padding:0 10px;font-size:12px;border-radius:6px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg .btn[aria-pressed="true"],.seg .btn[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.ok{background:var(--ok-bg);color:var(--ok)}.warn{background:var(--warn-bg);color:var(--warn)}.bad{background:var(--bad-bg);color:var(--bad)}.info{background:var(--info-bg);color:var(--info)}.neutral{background:var(--neutral-bg);color:var(--ink-2)}
.t-ok{color:var(--ok)}.t-warn{color:var(--warn)}.t-bad{color:var(--bad)}.t-info{color:var(--info)}.t-muted{color:var(--muted)}
.tbl{overflow-x:auto}
.tr{display:grid;gap:10px;padding:11px 18px;border-bottom:1px solid var(--line-2);align-items:center;min-width:760px}
.th{font-size:11px;letter-spacing:.04em;color:var(--muted);background:var(--surface-2);padding-top:10px;padding-bottom:10px}
.tfoot{background:var(--surface-2);border-bottom:none}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:12px;color:var(--muted)}
.inp,select.inp,textarea.inp{height:44px;border:1px solid var(--input);border-radius:8px;padding:0 12px;background:var(--surface);width:100%}
textarea.inp{height:auto;min-height:96px;padding:10px 12px;resize:vertical}
.inp-sm{height:36px;border:1px solid var(--input);border-radius:6px;padding:0 8px;background:var(--surface);width:100%;max-width:120px;text-align:right;font-family:var(--mono);font-size:13px}
.inp[aria-invalid="true"],.inp-sm[aria-invalid="true"]{border-color:var(--bad);background:var(--bad-bg)}
.readonly{height:44px;display:flex;align-items:center;padding:0 12px;border-radius:8px;background:var(--surface-2)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g5{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:var(--surface-2);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:4px}
.box{border:1px solid var(--line-2);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.banner{border-radius:10px;padding:12px 16px;font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.list-btn{display:flex;flex-direction:column;gap:5px;align-items:flex-start;padding:12px 16px;border:none;border-bottom:1px solid var(--line-2);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.list-btn[aria-pressed="true"]{background:var(--accent-soft)}
.list-btn .top{display:flex;justify-content:space-between;width:100%;gap:8px}
.pick{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:14px 16px;border-radius:10px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;min-height:100px;width:100%}
.pick[aria-pressed="true"],.pick[aria-checked="true"]{border:2px solid var(--accent-text);padding:13px 15px}
.pick.sel-solid[aria-checked="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps{list-style:none;margin:0;padding:14px 18px;display:flex;gap:8px;flex-wrap:wrap}
.steps li{flex:1;min-width:130px;display:flex;align-items:center;gap:10px}
.dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.d-done{background:var(--ok);color:var(--surface)}.d-now{background:var(--accent);color:var(--accent-ink)}.d-todo{background:var(--neutral-bg);color:var(--muted)}
.bars{list-style:none;margin:0;padding:0;display:flex;gap:6px}
.bars li{flex:1;display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600}
.bars .bar{height:6px;border-radius:3px;background:var(--line-2)}
.bars .on .bar{background:var(--accent)}.bars li:not(.on){color:var(--muted)}
.meter{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden}.meter i{display:block;height:6px;background:var(--bad)}
.ph{border-radius:8px;background:var(--neutral-bg);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink-2);text-align:center;padding:8px;min-height:110px}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:10px;overflow-x:auto}
.kcol{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:170px}
.kcard{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line-2);cursor:pointer;text-align:left;width:100%}
.kcard[aria-pressed="true"]{background:var(--accent-soft);border:2px solid var(--accent-text);padding:9px}
.kcard[disabled]{cursor:default;opacity:.85}
.doc{padding:26px 30px;display:flex;flex-direction:column;gap:18px}
.doc-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:14px;gap:16px;flex-wrap:wrap}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:8px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:min(560px,90vw);z-index:50}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
@media (max-width: 900px){
  .side{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);transition:transform .2s;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .topbar{display:flex;position:sticky;top:0;z-index:30;align-items:center;gap:12px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--nav-bg);color:var(--nav-ink)}
  .topbar button{background:transparent;border:1px solid var(--nav-line);color:var(--nav-ink);border-radius:8px;min-height:44px;min-width:44px;cursor:pointer}
  .app{flex-direction:column}
  main{padding:18px 16px 32px}
  .row{flex-direction:column}
  .side-w{width:auto!important}
}
</style>
</head>
<body>
<div class="topbar"><button type="button" data-act="menu" aria-label="Open navigation" aria-controls="nav"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><b>Crystal · Assets &amp; Procurement</b></div>
<div class="app">
  <nav id="nav" class="side" aria-label="Main navigation"></nav>
  <main id="view" tabindex="-1"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
const f = n => Number(n).toLocaleString('en-IN');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chip = (t, k) => `<span class="chip ${k}">${t}</span>`;
const lockIcon = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

/* ---------------- routes ---------------- */
const NAV = [
  ['Inventory', [['main','Warehouse stock'],['ledger','Stock ledger'],['damage','Damaged & missing']]],
  ['Procurement', [['mr','Material requests'],['raisepr','Raise purchase request'],['pr','PR approval'],['quotes','Vendor quotations'],['compare','Quote comparison'],['po','Purchase orders']]],
  ['Receiving', [['gate','Gate inward'],['qc','QA/QC inspection'],['grn','Goods receipt (GRN)'],['returns','Purchase returns']]],
  ['Accounts', [['notes','Debit & credit notes'],['recon','Vendor reconciliation']]]
];
const TITLES = {}; NAV.forEach(g => g[1].forEach(([k, t]) => TITLES[k] = t));

/* ---------------- shared state ---------------- */
const S = {
  site: 'Dhulagarh',
  mrImpact: 'Freezer room 3 is running on one evaporator after a coil failure; a second failure would force product transfer to Dankuni. Compressor and refrigerant are for the scheduled overhaul of chiller 2.',
  mrDecl: true, mrSubmitted: false,
  prRates: [182000, 238000, 9600], prChargeable: false, prTerms: [20, 0, 0, 70, 0, 10], prSubmitted: false,
  prDecision: null, prRemarks: 'Approved. Get at least three quotations; prefer vendors with low QC rejection history.',
  quoteSel: 1,
  quotes: [
    { name: 'Frostline Refrigeration', short: 'Frostline', ref: 'FR/Q/2026/381', date: '24 Sep 2026', valid: '24 Oct 2026', rates: [184000, 236000, 9800], freight: 6000, terms: '30% advance, 70% on delivery', warranty: '18 months', lead: ['10 days','14 days','3 days'], make: ['Frostline','Copeland','Honeywell'], file: 'FR_Q_381.pdf' },
    { name: 'Arctic Cool Engineers', short: 'Arctic Cool', ref: 'ACE-2609-17', date: '25 Sep 2026', valid: '10 Oct 2026', rates: [179500, 241000, 9400], freight: 0, terms: '100% within 30 days of delivery', warranty: '12 months', lead: ['7 days','12 days','2 days'], make: ['Kirloskar','Danfoss','SRF'], file: 'ACE_2609_17.pdf' },
    { name: 'Polar Tech Industries', short: 'Polar Tech', ref: 'PTI/RFQ/0922', date: '25 Sep 2026', valid: '25 Nov 2026', rates: [188000, 233500, 10200], freight: 9500, terms: '50% advance, 50% on delivery', warranty: '24 months', lead: ['15 days','10 days','4 days'], make: ['Polar','Copeland','Chemours'], file: 'PTI_0922.pdf' }
  ],
  award: null, justification: 'L1 vendor rejected 6.8% of receipts over 12 months against 1.2% for this vendor; premium is under 0.1% of order value.',
  awarded: null, tallyRef: '', poIssued: false,
  gateCounts: [500, 300, 22, 1000], gateTemp: '-17.4', gateSubmitted: false, gateRejected: false,
  qc: [{ acc: 480, hold: 0, rej: 20, reason: 'Physical damage' }, { acc: 288, hold: 12, rej: 0, reason: 'Dimension deviation' }, { acc: 22, hold: 0, rej: 0, reason: '' }, { acc: 1000, hold: 0, rej: 0, reason: '' }],
  holdDecision: null, qcSubmitted: false,
  grnApproved: false, grnFlagged: false,
  dmgSel: 0, dmgDec: 1, shortDec: 'await', shortConfirmed: false,
  rtvSel: '0006', rtvStage: { '0006': 0, '0005': 1 },
  dnSel: '0004', dnStage: { '0004': 0, '0003': 1, '0002': 2, '0001': 4 }, dnRoute: {}, cnVal: '50740', cnNo: 'NPP/CN/118',
  ledgerItem: 0,
  reconV: 0, reconMapped: false, reconDone: [false, false]
};

/* reference data for the receiving flow */
const RCV = [
  { name: 'HDPE pallet 1200 × 1000', uom: 'Nos', cls: 'Ambient · Nos', out: 500, dc: 500, rate: 2150, before: 820, reasons: ['Physical damage', 'Dimension deviation', 'Documentation missing'] },
  { name: 'PUF panel 100 mm', uom: 'sqm', cls: 'Ambient · sqm', out: 300, dc: 300, rate: 1850, before: 340, reasons: ['Dimension deviation', 'Physical damage', 'Documentation missing'] },
  { name: 'Temperature data logger', uom: 'Nos', cls: 'Instrument · Nos', out: 25, dc: 25, rate: 3400, before: 18, reasons: ['Calibration failure', 'Physical damage', 'Short supply'] },
  { name: 'Gel ice pack 2 kg, frozen', uom: 'Nos', cls: 'Cold chain · Nos', out: 1000, dc: 1000, rate: 95, before: 2400, reasons: ['Temperature breach', 'Physical damage', 'Expiry or shelf life'] }
];
const PR_LINES = [['Evaporator coil 22 kW', 'CC-EVP-220', 1], ['Scroll compressor 15 HP', 'CC-CMP-15', 2], ['Refrigerant R-404A, 10 kg', 'CC-RFG-404', 2]];

/* derived values */
const tempBreach = () => { const t = parseFloat(S.gateTemp); return isNaN(t) || t < -20 || t > -15; };
const qcDelivered = i => Number(S.gateCounts[i]) || 0;
const qcBalanced = i => { const q = S.qc[i]; return q.acc + q.hold + q.rej === qcDelivered(i); };
const qcAllBalanced = () => S.qc.every((q, i) => qcBalanced(i));
const anyHold = () => S.qc.some(q => q.hold > 0);
const holdQty = () => S.qc.reduce((t, q) => t + q.hold, 0);
const grnAccepted = i => S.qc[i].acc + (S.holdDecision === 'c' ? S.qc[i].hold : 0);
const rtvLines = () => S.qc.map((q, i) => ({ i, qty: q.rej + (S.holdDecision === 'r' ? q.hold : 0) })).filter(x => x.qty > 0);
const rtvTaxable = () => rtvLines().reduce((t, x) => t + x.qty * RCV[x.i].rate, 0);
const shortQty = () => Math.max(0, RCV[2].dc - (Number(S.gateCounts[2]) || 0));
const prGoods = () => PR_LINES.reduce((t, l, i) => t + Math.round(l[2] * (Number(S.prRates[i]) || 0) * 1.18), 0);
const prTotal = () => prGoods() + (S.prChargeable ? 5310 : 0);
const termsSum = () => S.prTerms.reduce((a, b) => a + (Number(b) || 0), 0);
const band = t => t <= 100000 ? { label: 'Up to ₹1 lakh', route: 'Site Manager' } : t <= 1000000 ? { label: '₹1–10 lakh', route: 'Site Manager, then Functional Head' } : { label: 'Above ₹10 lakh', route: 'Site Manager, Functional Head, then Director' };
const quoteQty = [1, 2, 2];
const landed = v => { const sub = v.rates.reduce((t, r, i) => t + (Number(r) || 0) * quoteQty[i], 0); const gst = Math.round(sub * 0.18); return { lines: v.rates.map((r, i) => (Number(r) || 0) * quoteQty[i]), sub, gst, total: sub + gst + (Number(v.freight) || 0) }; };
const ranks = () => S.quotes.map((v, i) => ({ i, t: landed(v).total })).sort((a, b) => a.t - b.t).map(x => x.i);
const awardIdx = () => S.award === null ? ranks()[0] : S.award;

/* ---------------- building blocks ---------------- */
function head(crumb, title, extra, right) {
  return `<header class="head"><div><div class="crumb">${crumb}</div><h1>${title}${extra || ''}</h1></div>${right ? `<div class="seg" style="align-items:center">${right}</div>` : ''}</header>`;
}
function table(cols, headers, rows, foot) {
  const h = `<div class="tr th" style="grid-template-columns:${cols}">${headers.map(x => `<div class="${x[1] ? 'r' : ''}">${x[0]}</div>`).join('')}</div>`;
  const body = rows.map(r => `<div class="tr" style="grid-template-columns:${cols}">${r.join('')}</div>`).join('');
  return `<div class="tbl">${h}${body}${foot || ''}</div>`;

  if (s === 2 && flagged) act = { t: 'Variance flagged — cannot close', x: `The vendor credited ₹ ${f(n.cnVal)} against ₹ ${f(t)}. Ask for a revised credit note, or accept the short credit with Head of Finance approval.`, l: 'Request revised credit note', alt: 'Accept with approval', danger: true };
  if (s === 3) act = { t: 'Offset recorded', x: `Payable on ${n.inv} reduced in Bill Control. Reconcile to update the vendor ledger and close the return.`, l: 'Reconcile and close' };
  if (s === 4) act = { t: 'Reconciled', x: 'Vendor ledger updated in Tally. The linked return is closed.', l: 'Closed', done: true };
  const pendingValue = N.reduce((sum, x) => sum + (S.dnStage[x.id] < 4 ? total(x) : 0), 0);
  return head('Accounts / Debit &amp; credit notes', 'Debit and credit notes', '', chip(`₹ ${f(pendingValue)} awaiting recovery`, 'warn')) +
  (!rtvOut ? `<div class="banner info"><span>RTV-…/0006 has not been dispatched yet, so its debit note does not exist. <a href="#returns">Dispatch it on Purchase returns</a> to create one.</span></div>` : '') +
  `<div class="row">
    <aside class="card side-w" style="width:330px;flex-shrink:0;overflow:hidden" aria-label="Debit note queue"><div class="card-h"><h2>Queue · created on return dispatch</h2></div>
      ${N.map(x => `<button type="button" class="list-btn" data-act="dnSel" data-arg="${x.id}" aria-pressed="${x.id === S.dnSel}"><span class="top"><span class="mono b" style="font-size:12px">${x.no.replace('Dhulagarh-', '')}</span>${chip(short[S.dnStage[x.id]], ck[S.dnStage[x.id]])}</span><b>${x.vendor}</b><span class="top sub"><span>${x.src}</span><span class="mono" style="color:var(--ink)">₹ ${f(total(x))}</span></span><span class="sub b ${x.ageK}">${x.age}</span></button>`).join('')}
    </aside>
    <div class="grow col">
      <section class="card pad col" style="gap:14px" aria-label="Debit note detail">
        <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><div style="font-size:18px;font-weight:700">${n.no} · ${n.vendor}</div><div class="note t-muted">${n.what}</div></div>${chip(code, s >= 4 ? 'ok' : 'info')}</div>
        <div class="seg" style="gap:8px">${[['Return', n.rtv], ['PO', n.po], ['GRN', n.grn], ['Invoice', n.inv], ['Tally voucher', s >= 1 ? 'DN/DHU/26-27/0' + (36 + Number(n.id)) : 'on issue']].map(r => `<span class="chip neutral" style="font-weight:400"><span class="t-muted">${r[0]}</span> <span class="mono">${r[1]}</span></span>`).join('')}</div>
        ${bars(['Pending', 'Issued · posted to Tally', 'Credit note received', 'Reconciled'], prog)}
        <div class="grid g2">
          <div class="box" style="font-size:13px"><span class="sub">GST treatment · mirrors ${n.inv}</span>${tax.map(r => `<div style="display:flex;justify-content:space-between"><span>${r[0]}</span><span class="mono">${r[1]}</span></div>`).join('')}<div style="display:flex;justify-content:space-between" class="b"><span>Debit note total</span><span class="mono">₹ ${f(t)}</span></div></div>
          <div class="box" style="font-size:13px"><span class="sub">Vendor credit note</span><div style="display:flex;justify-content:space-between"><span>Number</span><span class="mono">${s >= 2 ? esc(n.cn) : '—'}</span></div><div style="display:flex;justify-content:space-between"><span>Value</span><span class="mono">${s >= 2 ? '₹ ' + f(n.cnVal) : '—'}</span></div><div style="display:flex;justify-content:space-between"><span>Variance vs debit note</span><span class="mono b ${flagged ? 't-bad' : 't-ok'}">${variance === null ? '—' : variance.toFixed(1) + '%'}</span></div><span class="sub">Above 2% is flagged and blocks closure</span></div>
        </div>
      </section>
      <section class="card pad col" style="gap:12px" aria-label="Action">
        <h2 class="h2">${act.t}</h2><p class="note" style="margin:0">${act.x}</p>
        ${act.form ? `<div class="grid g3"><div class="field"><label for="cn-no">Credit note number</label><input id="cn-no" class="inp mono" data-in="cnNo" value="${esc(S.cnNo)}"></div><div class="field"><label for="cn-date">Date</label><input id="cn-date" class="inp" type="date" value="2026-09-30"></div><div class="field"><label for="cn-val">Value incl. GST ₹</label><input id="cn-val" class="inp mono" inputmode="numeric" data-in="cnVal" value="${esc(S.cnVal)}" aria-invalid="${flagged}"></div></div><span class="sub ${flagged ? 't-bad' : 't-ok'}">Debit note ₹ ${f(t)} · variance ${variance === null ? '—' : variance.toFixed(1) + '%'}${flagged ? ' — will be flagged' : ''}</span>` : ''}
        <div class="seg" style="justify-content:flex-end">${act.alt ? `<button type="button" class="btn" data-act="dnAlt">${act.alt}</button>` : ''}<button type="button" class="btn btn-primary" data-act="dnAct" ${act.done ? 'disabled' : ''} ${act.danger ? 'style="background:var(--bad);border-color:var(--bad)"' : ''}>${act.l}</button></div>
      </section>
      <a href="#recon" class="b" style="align-self:flex-end">Open vendor reconciliation</a>
    </div>
  </div>`;
};

SCREENS.recon = () => {
  const v = S.reconV, mapped = S.reconMapped;
  const NP = [['01 Sep','Opening balance','—','Brought forward',120000,120000,'Matched','ok'],['10 Sep','Payment','[UTR]','Against PO-…/0008',-120000,-120000,'Matched','ok'],['26 Sep','Invoice','NPP/INV/2291','₹62,776 held · 20 returned, 3 short',2135800,2135800,'Matched','ok'],['28 Sep','Debit note','DN-…/0004','RTV-…/0006 · 20 pallets',-50740,-50740,'Matched','ok'],['29 Sep','Advance payment','[UTR]', mapped ? 'Mapped to PO-…/0014' : 'Posted in Tally, not linked in portal', mapped ? -200000 : null, -200000, mapped ? 'Matched' : 'Only in Tally', mapped ? 'ok' : 'bad', !mapped],['30 Sep','Credit note','NPP/CN/118','Matches DN-…/0004 · no second posting',null,null,'Matched to DN','info'],['—','Open item','SHT-…/0003','3 loggers short · ₹12,036 held',null,null,'Awaiting decision','warn']];
  const FR = [['01 Sep','Opening balance','—','Brought forward',0,0,'Matched','ok'],['04 Sep','Invoice','FR/INV/1166','Evaporator coil · GRN-…/0014',214760,214760,'Matched','ok'],['20 Sep','Payment','[UTR]','Released after three-way match',-214760,-214760,'Matched','ok'],['—','Open item','RTV-…/0005','Warranty return · replacement awaited, no value',null,null,'No ledger effect','info']];
  let pb = 0, tb = 0;
  const fmt = x => x === null ? '—' : x < 0 ? f(-x) + ' Dr' : f(x) + ' Cr';
  const rows = (v === 0 ? NP : FR).map(r => { if (r[4] !== null) pb += r[4]; if (r[5] !== null) tb += r[5]; return [`<div class="t-muted">${r[0]}</div>`, `<div class="b">${r[1]}</div>`, `<div><div class="mono" style="font-size:12px">${r[2]}</div><div class="sub">${r[3]}</div></div>`, `<div class="r mono">${fmt(r[4])}</div>`, `<div class="r mono">${fmt(r[5])}</div>`, `<div class="r mono b">${f(pb)} Cr</div>`, `<div class="col" style="gap:4px;align-items:flex-start">${chip(r[6], r[7])}${r[8] ? '<button type="button" class="btn btn-sm" data-act="reconMap">Map to PO-…/0014</button>' : ''}</div>`]; });
  const diff = pb - tb, held = v === 0 ? 12036 : 0, done = S.reconDone[v];
  return head('Accounts / Vendor reconciliation · September 2026', 'Vendor reconciliation', '', `<button type="button" class="btn" data-act="toast" data-arg="Statement emailed to the vendor for confirmation">Send statement to vendor</button><button type="button" class="btn btn-primary" data-act="reconDone" ${diff !== 0 || done ? 'disabled' : ''} ${done ? 'style="background:var(--ok);border-color:var(--ok)"' : ''}>${done ? 'Reconciled for September' : diff === 0 ? 'Mark reconciled' : 'Resolve difference first'}</button>`) +
  `<div class="seg" role="radiogroup" aria-label="Vendor">${['Northern Polymers & Packaging', 'Frostline Refrigeration'].map((n, i) => `<button type="button" class="btn" role="radio" aria-checked="${i === v}" data-act="reconV" data-arg="${i}">${n}</button>`).join('')}</div>
  <div class="kpis">${[['Portal balance', '₹ ' + f(pb), 'Payable per portal records', ''], ['Tally ledger', '₹ ' + f(tb), 'Payable per books', ''], ['Difference', '₹ ' + f(Math.abs(diff)), diff === 0 ? 'Fully explained' : '1 unmatched entry', diff === 0 ? 't-ok' : 't-bad'], ['Held from payment', '₹ ' + f(held), held ? 'Open shortfall case' : 'Nothing held', held ? 't-warn' : 't-ok']].map(k => `<div class="card kpi"><span class="k">${k[0]}</span><span class="v ${k[3]}" style="font-size:22px">${k[1]}</span><span class="sub">${k[2]}</span></div>`).join('')}</div>
  <section class="card" aria-label="Statement">
    ${table('80px 150px 1.3fr 120px 120px 120px 160px', [['Date'],['Document'],['Reference'],['Portal ₹',1],['Tally ₹',1],['Balance ₹',1],['Match']], rows)}
    <p class="sub" style="padding:12px 18px;margin:0">Cr raises what we owe; Dr reduces it. Held amounts stay in the balance but cannot be released for payment until their return or shortfall case closes.</p>
  </section>`;
};

/* ---------------- actions ---------------- */
const go = r => { location.hash = r; };
const ACT = {
  menu: () => document.getElementById('nav').classList.toggle('open'),
  theme: () => { const r = document.documentElement; const dark = r.getAttribute('data-theme') === 'dark' || (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches); r.setAttribute('data-theme', dark ? 'light' : 'dark'); try { localStorage.setItem('theme', dark ? 'light' : 'dark'); } catch (e) {} },
  toast: a => toast(a),
  site: a => { S.site = a; },
  mrSubmit: () => { if (S.mrImpact.trim().length < 40) return toast('Business impact needs at least 40 characters'); if (!S.mrDecl) return toast('Tick the declaration to submit'); S.mrSubmitted = true; toast('MR submitted and approved · purchase balance ready for a PR'); go('raisepr'); },
  prChg: a => { S.prChargeable = a === '1'; },
  prSubmit: () => { if (termsSum() !== 100) return toast('Payment terms must total 100%'); S.prSubmitted = true; toast('PR-Dhulagarh-Sep2026/0031 submitted for approval'); go('pr'); },
  prDecide: a => { S.prDecision = a; toast(a === 'a' ? 'PR approved and locked · PDF emailed' : 'PR rejected · requester notified'); },
  prReset: () => { S.prDecision = null; },
  quoteSel: a => { S.quoteSel = +a; },
  award: a => { S.award = +a; },
  awardGo: () => { S.awarded = awardIdx(); toast(`Awarded to ${S.quotes[S.awarded].name}${S.awarded !== ranks()[0] ? ' · sent for Head of Supply Chain approval' : ''}`); go('po'); },
  poIssue: () => { if (!S.tallyRef.trim()) return toast('Enter the Tally PO reference first'); S.poIssued = true; toast('PO issued and emailed to the vendor'); },
  gateReject: () => { S.gateRejected = !S.gateRejected; toast(S.gateRejected ? 'Rejected at gate · buyer and vendor notified' : 'Gate rejection undone'); },
  gateSubmit: () => { S.gateSubmitted = true; toast('Sent to QA/QC · inspector notified'); go('qc'); },
  hold: a => { S.holdDecision = a; },
  qcSubmit: () => { if (!qcAllBalanced()) return toast('Every line must balance before submitting'); S.qcSubmitted = true; toast(rtvLines().length ? 'Verdict submitted · purchase return RTV-…/0006 drafted' : 'Verdict submitted'); },
  grnApprove: () => { if (anyHold() && !S.holdDecision) return toast('Decide the conditional hold first'); S.grnApproved = true; S.grnFlagged = false; toast('GRN approved · stock posted to Dhulagarh'); },
  grnFlag: () => { S.grnFlagged = !S.grnFlagged; toast(S.grnFlagged ? 'GRN flagged · excluded from PO received quantity' : 'Flag removed'); },
  dmgSel: a => { S.dmgSel = +a; },
  dmgDec: a => { S.dmgDec = +a; },
  dmgGo: () => { if (S.dmgDec === 1) { S.rtvSel = '0005'; go('returns'); } else toast(S.dmgDec === 0 ? 'Repair request raised · status UNDER_REPAIR' : 'Sent to Warehouse Lead and Head of Operations for approval'); },
  shortDec: a => { S.shortDec = a; },
  shortGo: () => { S.shortConfirmed = true; toast(S.shortDec === 'await' ? 'Balance of 3 awaited · vendor chased on the daily digest' : 'Line short-closed · debit note raised for the billed excess'); },
  rtvSel: a => { S.rtvSel = a; },
  rtvAdvance: () => { const k = S.rtvSel, s = S.rtvStage[k]; if (s >= 4) return; S.rtvStage[k] = s + 1; if (k === '0006' && s + 1 === 2) S.dnSel = '0004';
    const msgs = ['Return approved · PRN and gate pass generated', k === '0006' ? 'Goods dispatched · debit note DN-…/0004 created for Accounts' : 'Goods dispatched · stock reversed against the original GRN', 'Vendor acknowledgement recorded', 'Return closed'];
    toast(msgs[s]); },
  dnSel: a => { S.dnSel = a; },
  dnAct: () => { const k = S.dnSel, s = S.dnStage[k];
    const t = k === '0004' ? Math.round(rtvTaxable() * 1.18) : null;
    if (s === 0) { S.dnStage[k] = 1; toast('Debit note issued and posted to Tally'); }
    else if (s === 1) { S.dnStage[k] = 2; S.dnRoute[k] = 'Matched'; toast('Credit note recorded'); }
    else if (s === 2) { const v = k === '0004' ? Math.abs(t - (Number(String(S.cnVal).replace(/,/g, '')) || 0)) / t * 100 : k === '0002' ? 4.1 : 0; if (v > 2) return toast('Revised credit note requested from the vendor'); S.dnStage[k] = 4; if (k === '0004') S.rtvStage['0006'] = 4; toast('Reconciled · vendor ledger updated · return closed'); }
    else if (s === 3) { S.dnStage[k] = 4; if (k === '0004') S.rtvStage['0006'] = 4; toast('Reconciled · vendor ledger updated · return closed'); } },
  dnAlt: () => { const k = S.dnSel, s = S.dnStage[k]; if (s === 1) { S.dnStage[k] = 3; S.dnRoute[k] = 'Adjusted'; toast('Offset against the open invoice in Bill Control'); } else if (s === 2) { S.dnStage[k] = 4; if (k === '0004') S.rtvStage['0006'] = 4; toast('Short credit accepted with Head of Finance approval'); } },
  ledgerItem: a => { S.ledgerItem = +a; },
  reconV: a => { S.reconV = +a; },
  reconMap: () => { S.reconMapped = true; toast('Advance mapped to PO-…/0014 · difference cleared'); },
  reconDone: () => { S.reconDone[S.reconV] = true; toast('Vendor reconciled for September'); }
};

const INPUT = {
  mrImpact: el => { S.mrImpact = el.value; },
  mrDecl: el => { S.mrDecl = el.checked; },
  prRate: el => { S.prRates[+el.dataset.i] = el.value.replace(/[^0-9]/g, ''); },
  prTerm: el => { S.prTerms[+el.dataset.i] = el.value.replace(/[^0-9.]/g, ''); },
  prRemarks: el => { S.prRemarks = el.value; },
  qRate: el => { S.quotes[S.quoteSel].rates[+el.dataset.i] = el.value.replace(/[^0-9]/g, ''); },
  qFreight: el => { S.quotes[S.quoteSel].freight = el.value.replace(/[^0-9]/g, ''); },
  justification: el => { S.justification = el.value; },
  tallyRef: el => { S.tallyRef = el.value; },
  gateTemp: el => { S.gateTemp = el.value; },
  gateCount: el => { const i = +el.dataset.i; S.gateCounts[i] = el.value.replace(/[^0-9]/g, ''); const q = S.qc[i]; q.acc = Math.max(0, (Number(S.gateCounts[i]) || 0) - q.hold - q.rej); },
  qc: el => { S.qc[+el.dataset.i][el.dataset.k] = Number(el.value.replace(/[^0-9]/g, '')) || 0; },
  qcReason: el => { S.qc[+el.dataset.i].reason = el.value; },
  cnVal: el => { S.cnVal = el.value; },
  cnNo: el => { S.cnNo = el.value; }
};

/* ---------------- render ---------------- */
const view = document.getElementById('view'), nav = document.getElementById('nav');
function route() { const r = (location.hash || '#main').slice(1); return SCREENS[r] ? r : 'main'; }
function renderNav(r) {
  nav.innerHTML = `<div class="brand"><div class="brand-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 2v20M4.9 6.5l14.2 11M19.1 6.5L4.9 17.5"/></svg></div><div><b>Crystal</b><small>Assets &amp; Procurement</small></div></div>` +
    NAV.map(g => `<div class="nav-group"><div class="nav-label">${g[0]}</div>${g[1].map(([k, t]) => `<a class="nav-link" href="#${k}" ${k === r ? 'aria-current="page"' : ''}>${t}</a>`).join('')}</div>`).join('') +
    `<div class="nav-foot"><b>Signed in via Crystal Core</b>Site Receiver · Dhulagarh<br><button type="button" class="theme-btn" data-act="theme">Switch light / dark</button></div>`;
}
function render(keepScroll) {
  const r = route();
  const a = document.activeElement, id = a && a.id; let pos = null; try { if (a && typeof a.selectionStart === 'number') pos = [a.selectionStart, a.selectionEnd]; } catch (e) {}
  const y = window.scrollY;
  renderNav(r);
  view.innerHTML = SCREENS[r]();
  document.title = TITLES[r] + ' · Crystal';
  if (id) { const el = document.getElementById(id); if (el) { el.focus({ preventScroll: true }); if (pos && el.setSelectionRange) { try { el.setSelectionRange(pos[0], pos[1]); } catch (e) {} } } }
  if (keepScroll) window.scrollTo(0, y);
}
let tt;
function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2600); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && !b.disabled) { const fn = ACT[b.dataset.act]; if (fn) { fn(b.dataset.arg, b); if (b.dataset.act !== 'menu' && b.dataset.act !== 'toast') render(true); } return; }
  const link = e.target.closest('a.nav-link'); if (link) nav.classList.remove('open');
});
document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (el && INPUT[el.dataset.in]) { INPUT[el.dataset.in](el); render(true); } });
document.addEventListener('change', e => { const el = e.target.closest('[data-in]'); if (el && (el.type === 'checkbox' || el.tagName === 'SELECT') && INPUT[el.dataset.in]) { INPUT[el.dataset.in](el); render(true); } });
window.addEventListener('hashchange', () => { render(false); window.scrollTo(0, 0); view.focus({ preventScroll: true }); });
try { const th = localStorage.getItem('theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch (e) {}
render(false);
})();
</script>
</body>
</html>
