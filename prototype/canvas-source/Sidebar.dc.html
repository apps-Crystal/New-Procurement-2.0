<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Main navigation" style="width: 240px; height: 960px; box-sizing: border-box; background: #18202B; color: #E7E9EE; display: flex; flex-direction: column; padding: 20px 14px; gap: 12px; font-family: 'IBM Plex Sans', system-ui, sans-serif;">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px 14px 8px; border-bottom: 1px solid #2C3544;">
<div style="width: 34px; height: 34px; border-radius: 8px; background: #0B5F63; display: flex; align-items: center; justify-content: center;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20M4.9 6.5l14.2 11M19.1 6.5L4.9 17.5"></path></svg>
</div>
<div style="display: flex; flex-direction: column;">
<div style="font-weight: 700; font-size: 15px; letter-spacing: 0.2px;">Crystal</div>
<div style="font-size: 12px; color: #A7AFBD;">Assets &amp; Procurement</div>
</div>
</div>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 2px;">
<div style="font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: #A7AFBD; padding: 0 10px 6px 10px;">{{g.label}}</div>
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
<a href="{{it.href}}" style="{{it.style}}">{{it.label}}</a>
</sc-for>
</div>
</sc-for>
<div style="margin-top: auto; padding: 12px 10px; border-top: 1px solid #2C3544; display: flex; align-items: center; gap: 10px;">
<div style="width: 32px; height: 32px; border-radius: 50%; background: #2C3544; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;">SR</div>
<div style="display: flex; flex-direction: column;">
<div style="font-size: 13px; font-weight: 500;">Signed in via Crystal Core</div>
<div style="font-size: 12px; color: #A7AFBD;">Site Receiver · Dhulagarh</div>
</div>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["Main","StockLedger","Damage","RaiseMR","RaisePR","PR","Quotes","Compare","PO","GateInward","QC","GRN","Returns","CreditNote","VendorRecon"],"default":"Main"},"$preview":{"width":240,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'Main';
    const base = 'display:block;text-decoration:none;font-size:14px;padding:8px 10px;border-radius:7px;min-height:20px;';
    const mk = (label, key) => ({
      label, href: key + '.dc.html',
      style: key === active ? base + 'background:#0B5F63;color:#FFFFFF;font-weight:600;' : base + 'color:#D5D9E1;'
    });
    return {
      groups: [
        { label: 'Inventory', items: [mk('Warehouse stock', 'Main'), mk('Stock ledger', 'StockLedger'), mk('Damaged & missing', 'Damage')] },
        { label: 'Procurement', items: [mk('Material requests', 'RaiseMR'), mk('Raise purchase request', 'RaisePR'), mk('PR approval', 'PR'), mk('Vendor quotations', 'Quotes'), mk('Quote comparison', 'Compare'), mk('Purchase orders', 'PO')] },
        { label: 'Receiving', items: [mk('Gate inward', 'GateInward'), mk('QA/QC inspection', 'QC'), mk('Goods receipt (GRN)', 'GRN'), mk('Purchase returns', 'Returns')] },
        { label: 'Accounts', items: [mk('Debit & credit notes', 'CreditNote'), mk('Vendor reconciliation', 'VendorRecon')] }
      ]
    };
  }
}
</script>
</body>
</html>
